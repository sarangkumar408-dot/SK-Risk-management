<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Login | Risk Management System</title>
    <meta name="description" content="Client login portal for Risk Management System users and verification stakeholders." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="/" class="brand brand-lockup" aria-label="SK Risk Management home">
          <span class="brand-badge" aria-hidden="true">
            <svg viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shield logo">
              <path d="M55 6 L87 18 L87 52 C87 75 74 91 55 100 C36 91 23 75 23 52 L23 18 L55 6 Z" fill="#0a2a42" stroke="#d9b767" stroke-width="4"/>
              <circle cx="54" cy="48" r="22" fill="none" stroke="#d9b767" stroke-width="6"/>
              <path d="M69 60 L54 76 L42 64" fill="none" stroke="#d9b767" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M77 69 L88 81" fill="none" stroke="#d9b767" stroke-width="6" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-wordmark">
              <span class="brand-sk">SK</span>
              <span class="brand-name">RISK MANAGEMENT</span>
            </span>
            <span class="brand-tagline">Trust Verified. Risk Controlled.</span>
          </span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="about.html">About Us</a>
          <a href="services.html">Services</a>
          <a href="industries.html">Industries Served</a>
          <a href="coverage.html">Coverage Area</a>
          <a href="login.html">Client Login</a>
          <a href="contact.html">Contact Us</a>
        </nav>
        <div class="nav-actions">
          <a class="btn btn-secondary" href="login.html">Client Login</a>
          <button class="btn btn-primary nav-toggle" aria-label="Toggle navigation">Menu</button>
        </div>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container" style="max-width: 680px;">
          <div class="cta-banner">
            <span class="kicker">Client Login</span>
            <h2>Access your dashboard</h2>
            <form id="loginForm" class="form-grid" style="margin-top: 22px;">
              <div class="field" style="grid-column: 1 / -1;">
                <label for="email">User ID</label>
                <input id="email" type="email" placeholder= "Verifyrisk9@gmail.com" required />
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter password" required />
              </div>
              <div class="field" style="grid-column: 1 / -1;">
                <div id="loginStatus" style="color: #fca5a5; min-height: 20px; font-size: 0.95rem;"></div>
              </div>
              <div class="field" style="grid-column: 1 / -1;"><a href="#" style="color: var(--primary);">Forgot password?</a></div>
              <div class="hero-actions" style="grid-column: 1 / -1; margin-top: 0;">
                <button class="btn btn-primary" type="submit">Login</button>
                <a class="btn btn-secondary" href="contact.html">Request Access</a>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container copy-row">
        <span>© <span data-year></span> Risk Management System.</span>
        <span>Built for secure and scalable verification operations.</span>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
